name: Build & Download Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK & Licenses (API 36.1)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and debug.keystore
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Installable Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Battery-Forensics.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Forensics-APK
          path: app/build/outputs/apk/debug/Battery-Forensics.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish Direct-Download APK to GitHub Releases (latest-apk)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "Battery Forensics — Latest APK Build"
          body: |
            ### 📲 Direct APK Download (Android)
            Tap **`Battery-Forensics.apk`** under **Assets** below to download and install directly on your Android phone.
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
          files: app/build/outputs/apk/debug/Battery-Forensics.apk
          prerelease: true

      - name: Write APK Download Guide to Job Summary
        run: |
          APK_FILE="app/build/outputs/apk/debug/Battery-Forensics.apk"
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Battery Forensics APK Built Successfully!
          | Property | Value |
          | :--- | :--- |
          | **File Name** | \`Battery-Forensics.apk\` |
          | **APK Size** | \`$APK_SIZE\` |
          | **SHA-256** | \`$APK_SHA256\` |

          ### 📥 How to Download & Install:
          1. **Direct Phone Download (No Unzip Needed):** Go to your repository's **Releases** section and tap **\`Battery-Forensics.apk\`** under \`latest-apk\`.
          2. **From GitHub Actions:** Scroll down to the **Artifacts** section at the bottom of this run summary and click **\`Battery-Forensics-APK\`**.
          EOF
